# Robot System Tools - Unified Configuration
# Central configuration file for all system components

# System Settings
system:
  name: "Robot System Tools"
  version: "1.0"
  environment: "development"
  log_level: "INFO"

# Robot Configuration
robot:
  type: "UR"
  ip_address: "192.168.0.10"
  
  # Movement settings
  default_speed: 0.03
  default_acceleration: 0.08
  
  # Safety settings
  position_tolerance: 0.001
  rotation_tolerance: 0.01
  
  # Calibration specific speeds
  calibration_speed: 0.02
  calibration_acceleration: 0.1

# Camera Configuration
camera:
  type: "pi_camera"
  
  # Pi Camera Server
  server:
    host: "100.114.26.7"
    port: 2222
    timeout: 10
  
  # Local camera settings
  client:
    download_directory: "photos"
    auto_create_dirs: true
  
  # Camera calibration
  calibration:
    file: "camera_calibration/camera_calibration.yaml"
    auto_load: true
    required: true

# AprilTag Detection Configuration
apriltag:
  family: "tag36h11"
  tag_size: 0.023
  
  # Detection parameters
  detection:
    max_hamming: 2
    quad_decimate: 2.0
    quad_sigma: 0.0
    decode_sharpening: 0.25
    
  # Pose estimation
  pose:
    iterations: 100
    tolerance: 1e-6

# Coordinate System Configuration
coordinates:
  robot_base_frame: "robot_base"
  camera_frame: "camera"
  apriltag_frame: "apriltag"
  
  conventions:
    robot: "ROS"
    camera: "opencv"
    apriltag: "opencv"

# File Paths
paths:
  project_root: "."
  config_dir: "."
  camera_calibration_dir: "camera_calibration"
  photos_dir: "photos"
  logs_dir: "logs"
  archive_dir: "archive"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/robot_system.log"
  max_file_size: "10MB"
  backup_count: 5

# Development/Debug Settings
debug:
  enabled: false
  save_debug_images: false
  show_detection_images: false
  verbose_logging: false
  
# Safety Limits
safety:
  max_tcp_speed: 0.25
  max_tcp_acceleration: 1.0
  workspace_limits:
    x_min: -0.5
    x_max: 0.5
    y_min: -0.5
    y_max: 0.5
    z_min: 0.0
    z_max: 0.5